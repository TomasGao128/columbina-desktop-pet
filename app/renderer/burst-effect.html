    />
    <link rel="stylesheet" href="./burst-effect.css" />

        <img id="actorPrevious" src="./burst-canonical.png" alt="" /><img

      <div id="caption">月翼天穹<span>愿月光，温柔地拥抱你。</span></div>

    <script src="./burst-effect.js"></script>
